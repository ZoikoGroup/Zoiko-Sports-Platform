# Zoiko Sports CI. Each job runs the same pipeline script developers run locally:
#   backend/scripts/ci.sh   lint, types, tests on PostgreSQL 16, audits, image scan
#   frontend/scripts/ci.sh  lint, type check + build, npm audit, image scan
#   npm run test:e2e        browser tests against the real API (D-037)
# `main` requires all three jobs to pass before a pull request can merge (D-007).
# (.github/ is the agreed exception to the two-top-level-folders rule: GitHub
# only reads workflows from here.)
name: CI

on:
  push:
    branches: ["**"]
  pull_request:
    branches: [main]
  workflow_dispatch:

# The workflow only reads the repository.
permissions:
  contents: read

# A newer push to the same branch supersedes the running check.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: backend
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    defaults:
      run:
        working-directory: backend
    steps:
      # Third-party actions are pinned to exact commits (version in the comment).
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version-file: backend/.python-version
          cache: pip
          cache-dependency-path: backend/requirements-dev.txt
      - name: Install locked dependencies (hash-verified)
        run: python -m pip install --require-hashes -r requirements-dev.txt
      - name: Backend pipeline
        run: scripts/ci.sh
        env:
          PYTHON: python

  frontend:
    name: frontend
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install locked dependencies
        run: npm ci --no-audit --no-fund
      - name: Frontend pipeline
        run: scripts/ci.sh

  # Browser tests (Playwright, Microsoft Edge) against the real Django API on a
  # throwaway PostgreSQL 16 container, exactly as `npm run test:e2e` runs locally.
  e2e:
    name: e2e
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version-file: backend/.python-version
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - name: Install backend dependencies (hash-verified)
        working-directory: backend
        run: python -m pip install --require-hashes -r requirements.txt
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install frontend dependencies
        run: npm ci --no-audit --no-fund
      - name: Microsoft Edge
        run: |
          if ! command -v microsoft-edge-stable >/dev/null; then npx playwright install --with-deps msedge; fi
          microsoft-edge-stable --version
      - name: Browser tests
        run: npm run test:e2e
        env:
          E2E_PYTHON: python
