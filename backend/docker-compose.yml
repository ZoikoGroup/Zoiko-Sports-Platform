# Zoiko Sports — full stack. Run from this folder (backend/):
#   docker compose up -d --build
#
#   frontend: nginx serving the built SPA on http://localhost:${ZS_HTTP_PORT:-8080}
#             and proxying /api, /admin and /static to the backend.
#   backend:  Django API (gunicorn) on the internal network only; the generated
#             secret key and the rate-limit cache live on the backend-data volume.
#   worker:   delivers outbox events to their consumers (activity feed …); same
#             image, no published port; healthy while its heartbeat is fresh.
#   db:       PostgreSQL 16 on the internal network only; data on postgres-data.
# Settings come from backend/.env (copy .env.example). POSTGRES_PASSWORD is
# required; every other value has a safe default.
name: zoiko-sports

x-database: &database
  POSTGRES_DB: ${POSTGRES_DB:-zoiko}
  POSTGRES_USER: ${POSTGRES_USER:-zoiko}
  POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in backend/.env (see .env.example)}

services:
  db:
    image: postgres:16-bookworm
    restart: unless-stopped
    environment:
      <<: *database
      # Password logins use SCRAM-SHA-256, never md5 or trust.
      POSTGRES_INITDB_ARGS: --auth-host=scram-sha-256 --auth-local=scram-sha-256
    volumes:
      - postgres-data:/var/lib/postgresql/data
    expose:
      - "5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$${POSTGRES_USER}\" -d \"$${POSTGRES_DB}\""]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 10s

  backend:
    build:
      context: .
    image: zoiko-sports-backend:latest
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      <<: *database
      DATABASE_HOST: db
      DATABASE_PORT: "5432"
      DATABASE_SSLMODE: ${DATABASE_SSLMODE:-}
      DJANGO_DEBUG: "false"
      DJANGO_SECRET_KEY: ${DJANGO_SECRET_KEY:-}          # empty = generated and kept on the volume
      DJANGO_ALLOWED_HOSTS: ${ZS_ALLOWED_HOSTS:-localhost,127.0.0.1}
      DJANGO_CSRF_TRUSTED_ORIGINS: ${ZS_PUBLIC_ORIGIN:-http://localhost:8080}
      DJANGO_SECURE_COOKIES: ${DJANGO_SECURE_COOKIES:-false}  # set true when served over HTTPS
      DJANGO_NUM_PROXIES: "1"
      DJANGO_CACHE_DIR: /app/data/cache
      FRONTEND_URL: ${ZS_PUBLIC_ORIGIN:-http://localhost:8080}
      DJANGO_ADMIN_ENABLED: ${DJANGO_ADMIN_ENABLED:-false}  # Zoiko staff tooling; off unless needed
      DJANGO_ADMIN_PATH: ${DJANGO_ADMIN_PATH:-admin/}
      AUTH_THROTTLE_RATE: ${AUTH_THROTTLE_RATE:-10/min}
      SESSION_REMEMBER_DAYS: ${SESSION_REMEMBER_DAYS:-14}
      INVITATION_TTL_DAYS: ${INVITATION_TTL_DAYS:-7}
      INVITATION_THROTTLE_RATE: ${INVITATION_THROTTLE_RATE:-30/min}
      API_PAGE_SIZE: ${API_PAGE_SIZE:-25}
      API_MAX_PAGE_SIZE: ${API_MAX_PAGE_SIZE:-100}
      IDEMPOTENCY_TTL_HOURS: ${IDEMPOTENCY_TTL_HOURS:-24}
      DJANGO_EMAIL_BACKEND: ${DJANGO_EMAIL_BACKEND:-django.core.mail.backends.console.EmailBackend}
      DJANGO_DEFAULT_FROM_EMAIL: ${DJANGO_DEFAULT_FROM_EMAIL:-Zoiko Sports <no-reply@zoikosports.local>}
      DJANGO_EMAIL_HOST: ${DJANGO_EMAIL_HOST:-}
      DJANGO_EMAIL_PORT: ${DJANGO_EMAIL_PORT:-587}
      DJANGO_EMAIL_HOST_USER: ${DJANGO_EMAIL_HOST_USER:-}
      DJANGO_EMAIL_HOST_PASSWORD: ${DJANGO_EMAIL_HOST_PASSWORD:-}
      DJANGO_EMAIL_USE_TLS: ${DJANGO_EMAIL_USE_TLS:-true}
      AUTH_GOOGLE_CLIENT_ID: ${AUTH_GOOGLE_CLIENT_ID:-}
      AUTH_MICROSOFT_CLIENT_ID: ${AUTH_MICROSOFT_CLIENT_ID:-}
      AUTH_APPLE_CLIENT_ID: ${AUTH_APPLE_CLIENT_ID:-}
      AUTH_SSO_METADATA_URL: ${AUTH_SSO_METADATA_URL:-}
      AUTH_PASSKEYS_ENABLED: ${AUTH_PASSKEYS_ENABLED:-false}
      ZS_SEED_DEMO: ${ZS_SEED_DEMO:-false}
      ZS_DEMO_PASSWORD: ${ZS_DEMO_PASSWORD:-}
      ZS_DB_WAIT_SECONDS: ${ZS_DB_WAIT_SECONDS:-60}
      GUNICORN_WORKERS: ${GUNICORN_WORKERS:-3}
      GUNICORN_TIMEOUT: ${GUNICORN_TIMEOUT:-30}
      GUNICORN_ACCESS_LOG: ${GUNICORN_ACCESS_LOG:-true}
    volumes:
      - backend-data:/app/data
    expose:
      - "8000"

  worker:
    image: zoiko-sports-backend:latest
    restart: unless-stopped
    command: ["python", "manage.py", "outbox", "worker"]
    depends_on:
      # Starts after the API container has applied migrations and created the secret key.
      backend:
        condition: service_healthy
    environment:
      <<: *database
      DATABASE_HOST: db
      DATABASE_PORT: "5432"
      DATABASE_SSLMODE: ${DATABASE_SSLMODE:-}
      DJANGO_DEBUG: "false"
      DJANGO_SECRET_KEY: ${DJANGO_SECRET_KEY:-}          # empty = the key the API generated on the volume
      ZS_RUN_MIGRATIONS: "false"
      ZS_DB_WAIT_SECONDS: ${ZS_DB_WAIT_SECONDS:-60}
      OUTBOX_POLL_INTERVAL_MS: ${OUTBOX_POLL_INTERVAL_MS:-500}
      OUTBOX_BATCH_SIZE: ${OUTBOX_BATCH_SIZE:-100}
      OUTBOX_MAX_ATTEMPTS: ${OUTBOX_MAX_ATTEMPTS:-8}
      OUTBOX_RETRY_BASE_SECONDS: ${OUTBOX_RETRY_BASE_SECONDS:-2}
      OUTBOX_RETRY_MAX_SECONDS: ${OUTBOX_RETRY_MAX_SECONDS:-600}
      OUTBOX_HEARTBEAT_FILE: /app/data/worker-heartbeat
      OUTBOX_RETENTION_DAYS: ${OUTBOX_RETENTION_DAYS:-30}
      # Housekeeping: expired sessions, idempotency records, old delivered events.
      MAINTENANCE_INTERVAL_HOURS: ${MAINTENANCE_INTERVAL_HOURS:-6}
    volumes:
      - backend-data:/app/data
    healthcheck:
      test: ["CMD", "python", "-c", "import os, sys, time; sys.exit(0 if time.time() - os.path.getmtime('/app/data/worker-heartbeat') < 30 else 1)"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 30s

  frontend:
    build:
      context: ../frontend
      args:
        VITE_LINK_PRIVACY: ${VITE_LINK_PRIVACY:-}
        VITE_LINK_TERMS: ${VITE_LINK_TERMS:-}
        VITE_LINK_SECURITY: ${VITE_LINK_SECURITY:-}
        VITE_LINK_ACCESSIBILITY: ${VITE_LINK_ACCESSIBILITY:-}
        VITE_LINK_HELP: ${VITE_LINK_HELP:-}
    image: zoiko-sports-frontend:latest
    restart: unless-stopped
    ports:
      - "${ZS_HTTP_PORT:-8080}:8080"
    depends_on:
      backend:
        condition: service_healthy

volumes:
  backend-data:
  postgres-data:
