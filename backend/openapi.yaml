openapi: 3.0.3
info:
  title: Zoiko Sports API
  version: 1.0.0
  description: 'Conventions: errors use {"error": {code, message, request_id, fields?}};
    every response carries X-Request-ID; lists use cursor pagination ({next, previous,
    results}); creates take an Idempotency-Key header; edits state the `version` they
    are based on and get 409 version_conflict when it moved; instants are RFC 3339
    in UTC; time zones are IANA names.'
paths:
  /api/v1/activity/:
    get:
      operationId: activity_list
      description: Readable entries about the acting organization, newest first, built
        from events. Needs an organization workspace whose role grants `activity.view`.
        Entries about other organizations are never included.
      summary: The organization's activity feed
      parameters:
      - name: cursor
        required: false
        in: query
        description: Opaque position from a previous page's next/previous link.
        schema:
          type: string
      - name: page_size
        required: false
        in: query
        description: Rows per page (default 25, at most 100).
        schema:
          type: integer
      tags:
      - activity
      security:
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedActivityEntryList'
          description: ''
        '400':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          description: Invalid request (validation_error, invalid_cursor, idempotency_key_required,
            ...).
        '401':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          description: Sign-in required (not_authenticated).
        '403':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          description: Not allowed (permission_denied, csrf_failed, or a module-specific
            code).
  /api/v1/auth/config/:
    get:
      operationId: auth_config_retrieve
      description: Which sign-in methods are genuinely available in this environment.
      summary: Available sign-in methods
      tags:
      - auth
      security:
      - cookieAuth: []
      - {}
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthConfig'
          description: ''
  /api/v1/auth/csrf/:
    get:
      operationId: auth_csrf_retrieve
      description: Sets the CSRF cookie the SPA echoes back in X-CSRFToken.
      summary: Set the CSRF cookie
      tags:
      - auth
      security:
      - cookieAuth: []
      - {}
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Status'
          description: ''
  /api/v1/auth/login/:
    post:
      operationId: auth_login_create
      description: 'Authenticates, then resolves the account''s workspace contexts:
        exactly one candidate is entered; several leave `context` null with `context_status`
        selection_required (choose one with PUT /me/context/); none gives no_access.
        `account_type` narrows the candidates when it matches and never grants access.'
      summary: Sign in
      tags:
      - auth
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/LoginRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/LoginRequest'
        required: true
      security:
      - cookieAuth: []
      - {}
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LoginResponse'
          description: ''
        '400':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          description: Invalid request (validation_error, invalid_cursor, idempotency_key_required,
            ...).
        '403':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          description: Not allowed (permission_denied, csrf_failed, or a module-specific
            code).
        '429':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RateLimited'
          description: Too many requests (rate_limited with retry_after).
  /api/v1/auth/logout/:
    post:
      operationId: auth_logout_create
      summary: Sign out
      tags:
      - auth
      security:
      - cookieAuth: []
      - {}
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Session'
          description: ''
        '403':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          description: Not allowed (permission_denied, csrf_failed, or a module-specific
            code).
  /api/v1/auth/password-reset/:
    post:
      operationId: auth_password_reset_create
      summary: Request a password-reset link
      tags:
      - auth
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/EmailRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/EmailRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/EmailRequest'
        required: true
      security:
      - cookieAuth: []
      - {}
      responses:
        '202':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Status'
          description: Accepted. Identical for registered and unknown addresses.
        '400':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          description: Invalid request (validation_error, invalid_cursor, idempotency_key_required,
            ...).
        '403':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          description: Not allowed (permission_denied, csrf_failed, or a module-specific
            code).
        '429':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RateLimited'
          description: Too many requests (rate_limited with retry_after).
  /api/v1/auth/password-reset/confirm/:
    post:
      operationId: auth_password_reset_confirm_create
      summary: Set a new password from a reset link
      tags:
      - auth
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PasswordResetConfirmRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/PasswordResetConfirmRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/PasswordResetConfirmRequest'
        required: true
      security:
      - cookieAuth: []
      - {}
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Status'
          description: ''
        '400':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          description: Invalid request (validation_error, invalid_cursor, idempotency_key_required,
            ...).
        '403':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          description: Not allowed (permission_denied, csrf_failed, or a module-specific
            code).
        '429':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RateLimited'
          description: Too many requests (rate_limited with retry_after).
  /api/v1/auth/providers/{provider}/start/:
    post:
      operationId: auth_providers_start_create
      description: 'No provider flow is connected yet: every call returns an error
        explaining why.'
      summary: Start federated sign-in
      parameters:
      - in: path
        name: provider
        schema:
          type: string
        required: true
      tags:
      - auth
      security:
      - cookieAuth: []
      - {}
      responses:
        '403':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          description: Not allowed (permission_denied, csrf_failed, or a module-specific
            code).
        '404':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          description: Not found, or not visible to the caller (not_found).
        '429':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RateLimited'
          description: Too many requests (rate_limited with retry_after).
        '501':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          description: Not implemented in this environment.
        '503':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          description: Temporarily unavailable.
  /api/v1/auth/register/:
    post:
      operationId: auth_register_create
      summary: Register an account
      tags:
      - auth
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RegisterRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/RegisterRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/RegisterRequest'
        required: true
      security:
      - cookieAuth: []
      - {}
      responses:
        '202':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Status'
          description: Accepted. Identical for registered and unknown addresses.
        '400':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          description: Invalid request (validation_error, invalid_cursor, idempotency_key_required,
            ...).
        '403':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          description: Not allowed (permission_denied, csrf_failed, or a module-specific
            code).
        '429':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RateLimited'
          description: Too many requests (rate_limited with retry_after).
  /api/v1/auth/session/:
    get:
      operationId: auth_session_retrieve
      summary: Current session
      tags:
      - auth
      security:
      - cookieAuth: []
      - {}
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Session'
          description: ''
  /api/v1/auth/verify-email/:
    post:
      operationId: auth_verify_email_create
      summary: Verify an email address
      tags:
      - auth
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TokenRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/TokenRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/TokenRequest'
        required: true
      security:
      - cookieAuth: []
      - {}
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Status'
          description: ''
        '400':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          description: Invalid request (validation_error, invalid_cursor, idempotency_key_required,
            ...).
        '403':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          description: Not allowed (permission_denied, csrf_failed, or a module-specific
            code).
        '429':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RateLimited'
          description: Too many requests (rate_limited with retry_after).
  /api/v1/auth/verify-email/resend/:
    post:
      operationId: auth_verify_email_resend_create
      summary: Send a new verification link
      tags:
      - auth
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/EmailRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/EmailRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/EmailRequest'
        required: true
      security:
      - cookieAuth: []
      - {}
      responses:
        '202':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Status'
          description: Accepted. Identical for registered and unknown addresses.
        '400':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          description: Invalid request (validation_error, invalid_cursor, idempotency_key_required,
            ...).
        '403':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          description: Not allowed (permission_denied, csrf_failed, or a module-specific
            code).
        '429':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RateLimited'
          description: Too many requests (rate_limited with retry_after).
  /api/v1/invitations/accept/:
    post:
      operationId: invitations_accept_create
      description: 'Creates (or reactivates) the membership, marks the invitation
        used and makes the organization''s workspace the active context. Errors: invitation_invalid,
        invitation_expired, invitation_used (409), invitation_email_mismatch (403),
        already_member (409).'
      summary: Accept an invitation
      tags:
      - invitations
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/InvitationTokenRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/InvitationTokenRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/InvitationTokenRequest'
        required: true
      security:
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Session'
          description: ''
        '400':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          description: Invalid request (validation_error, invalid_cursor, idempotency_key_required,
            ...).
        '401':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          description: Sign-in required (not_authenticated).
        '403':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          description: Not allowed (permission_denied, csrf_failed, or a module-specific
            code).
        '409':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/VersionConflict'
          description: Conflict (version_conflict with current_version, or request_in_progress).
        '429':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RateLimited'
          description: Too many requests (rate_limited with retry_after).
  /api/v1/invitations/preview/:
    post:
      operationId: invitations_preview_create
      description: |-
        What an emailed invitation offers, so the person can decide before signing in.

        POST (not GET) keeps the token out of URLs and access logs.
      summary: Preview an invitation
      tags:
      - invitations
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/InvitationTokenRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/InvitationTokenRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/InvitationTokenRequest'
        required: true
      security:
      - cookieAuth: []
      - {}
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/InvitationPreview'
          description: ''
        '400':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          description: Invalid request (validation_error, invalid_cursor, idempotency_key_required,
            ...).
        '403':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          description: Not allowed (permission_denied, csrf_failed, or a module-specific
            code).
        '429':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RateLimited'
          description: Too many requests (rate_limited with retry_after).
  /api/v1/me/:
    get:
      operationId: me_retrieve
      summary: The signed-in user and workspace contexts
      tags:
      - me
      security:
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Session'
          description: ''
        '401':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          description: Sign-in required (not_authenticated).
  /api/v1/me/context/:
    get:
      operationId: me_context_retrieve
      description: 'The active workspace context: read it (requires one) or switch
        it.'
      summary: The active workspace context
      tags:
      - me
      security:
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WorkspaceContext'
          description: ''
        '401':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          description: Sign-in required (not_authenticated).
        '403':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          description: Not allowed (permission_denied, csrf_failed, or a module-specific
            code).
    put:
      operationId: me_context_update
      description: Verifies the context against current memberships, rotates the session
        ID and drops every session value scoped to the previous context. 404 when
        the context is unknown or not the user's.
      summary: Switch workspace context
      tags:
      - me
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ContextSwitchRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/ContextSwitchRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/ContextSwitchRequest'
        required: true
      security:
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Session'
          description: ''
        '400':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          description: Invalid request (validation_error, invalid_cursor, idempotency_key_required,
            ...).
        '401':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          description: Sign-in required (not_authenticated).
        '403':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          description: Not allowed (permission_denied, csrf_failed, or a module-specific
            code).
        '404':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          description: Not found, or not visible to the caller (not_found).
  /api/v1/me/contexts/:
    get:
      operationId: me_contexts_retrieve
      summary: Workspace contexts the user may act in
      tags:
      - me
      security:
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ContextList'
          description: ''
        '401':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          description: Sign-in required (not_authenticated).
components:
  schemas:
    AccountTypeEnum:
      enum:
      - organization
      - venue
      - club
      - individual
      type: string
      description: |-
        * `organization` - Organization
        * `venue` - Venue
        * `club` - Team / Club
        * `individual` - Individual
    AccountTypeOption:
      type: object
      properties:
        id:
          $ref: '#/components/schemas/AccountTypeEnum'
        label:
          type: string
      required:
      - id
      - label
    ActivityEntry:
      type: object
      properties:
        id:
          type: string
          format: uuid
          readOnly: true
        occurred_at:
          type: string
          format: date-time
          readOnly: true
        kind:
          type: string
          description: Event type the entry was built from, e.g. invitation.accepted.
        summary:
          type: string
          description: One readable line, e.g. 'Casey Club joined Club A as Club coordinator.'
      required:
      - id
      - kind
      - occurred_at
      - summary
    AuthConfig:
      type: object
      properties:
        account_types:
          type: array
          items:
            $ref: '#/components/schemas/AccountTypeOption'
        providers:
          type: array
          items:
            $ref: '#/components/schemas/ProviderOption'
        passkeys_enabled:
          type: boolean
        session_remember_days:
          type: integer
          description: Lifetime in days of a 'keep me signed in' session.
      required:
      - account_types
      - passkeys_enabled
      - providers
      - session_remember_days
    ContextList:
      type: object
      properties:
        active:
          type: string
          nullable: true
        contexts:
          type: array
          items:
            $ref: '#/components/schemas/WorkspaceContext'
      required:
      - active
      - contexts
    ContextOrganization:
      type: object
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
        kind:
          type: string
          description: organizer, venue or club.
      required:
      - id
      - kind
      - name
    ContextStatusEnum:
      enum:
      - active
      - selection_required
      - no_access
      type: string
      description: |-
        * `active` - A context is active.
        * `selection_required` - Several contexts (or none active): the user chooses one.
        * `no_access` - The account has no context it may act in.
    ContextSwitchRequest:
      type: object
      properties:
        context:
          type: string
          minLength: 1
          description: ID of one of the user's contexts.
          maxLength: 64
      required:
      - context
    EmailRequest:
      type: object
      properties:
        email:
          type: string
          format: email
          minLength: 1
      required:
      - email
    Error:
      type: object
      properties:
        error:
          $ref: '#/components/schemas/ErrorDetail'
      required:
      - error
    ErrorDetail:
      type: object
      properties:
        code:
          type: string
          description: Stable, machine-readable error code.
        message:
          type: string
          description: Message that is safe to show to the user.
        request_id:
          type: string
          description: Correlation ID of the request (also in X-Request-ID).
        fields:
          type: object
          additionalProperties:
            type: array
            items:
              type: string
          description: Messages per input field, when the error concerns specific
            fields.
      required:
      - code
      - message
      - request_id
    InvitationOrganization:
      type: object
      properties:
        name:
          type: string
        kind:
          $ref: '#/components/schemas/OrganizationKindEnum'
      required:
      - kind
      - name
    InvitationPreview:
      type: object
      properties:
        organization:
          $ref: '#/components/schemas/InvitationOrganization'
        account_type:
          type: string
          description: 'The workspace the invitation opens: organization, venue or
            club.'
        role:
          type: string
        role_name:
          type: string
          description: The role's display name from the catalogue.
        email:
          type: string
          description: The invited address, partly masked.
        expires_at:
          type: string
          format: date-time
        state:
          $ref: '#/components/schemas/InvitationStateEnum'
      required:
      - account_type
      - email
      - expires_at
      - organization
      - role
      - role_name
      - state
    InvitationStateEnum:
      enum:
      - pending
      - expired
      - accepted
      type: string
      description: |-
        * `pending` - Can be accepted.
        * `expired` - Past its expiry; ask for a new invitation.
        * `accepted` - Already used.
    InvitationTokenRequest:
      type: object
      properties:
        token:
          type: string
          minLength: 1
          description: The token from the emailed link.
          maxLength: 128
      required:
      - token
    LoginRequest:
      type: object
      properties:
        email:
          type: string
          format: email
          minLength: 1
        password:
          type: string
          minLength: 1
        account_type:
          nullable: true
          description: |-
            Preferred workspace (the sign-in tile). A preference only: it selects among the contexts the account's memberships grant and never grants one.

            * `organization` - Organization
            * `venue` - Venue
            * `club` - Team / Club
            * `individual` - Individual
          oneOf:
          - $ref: '#/components/schemas/AccountTypeEnum'
          - $ref: '#/components/schemas/NullEnum'
        remember:
          type: boolean
          default: false
      required:
      - email
      - password
    LoginResponse:
      type: object
      description: '`authenticated` is always present; the other fields only when
        it is true.'
      properties:
        authenticated:
          type: boolean
        user:
          $ref: '#/components/schemas/SessionUser'
        context:
          allOf:
          - $ref: '#/components/schemas/WorkspaceContext'
          nullable: true
        contexts:
          type: array
          items:
            $ref: '#/components/schemas/WorkspaceContext'
        context_status:
          $ref: '#/components/schemas/ContextStatusEnum'
        context_ended:
          type: boolean
          description: The previous context stopped being valid (membership or organization
            ended).
        permissions:
          type: array
          items:
            type: string
          description: Permission codes the active context's role grants (empty without
            an organization context).
        preference_matched:
          type: boolean
          nullable: true
          description: Whether the preferred workspace matched a context; null without
            a preference.
      required:
      - authenticated
      - preference_matched
    NullEnum:
      enum:
      - null
    OrganizationKindEnum:
      enum:
      - organizer
      - venue
      - club
      type: string
      description: |-
        * `organizer` - Competition organizer
        * `venue` - Venue operator
        * `club` - Team / club
    PaginatedActivityEntryList:
      type: object
      required:
      - results
      properties:
        next:
          type: string
          nullable: true
          format: uri
        previous:
          type: string
          nullable: true
          format: uri
        results:
          type: array
          items:
            $ref: '#/components/schemas/ActivityEntry'
    PasswordResetConfirmRequest:
      type: object
      properties:
        uid:
          type: string
          minLength: 1
        token:
          type: string
          minLength: 1
        new_password:
          type: string
          minLength: 1
      required:
      - new_password
      - token
      - uid
    ProviderOption:
      type: object
      properties:
        id:
          type: string
        name:
          type: string
        enabled:
          type: boolean
      required:
      - enabled
      - id
      - name
    RateLimited:
      type: object
      properties:
        error:
          $ref: '#/components/schemas/RateLimitedDetail'
      required:
      - error
    RateLimitedDetail:
      type: object
      properties:
        code:
          type: string
          description: Stable, machine-readable error code.
        message:
          type: string
          description: Message that is safe to show to the user.
        request_id:
          type: string
          description: Correlation ID of the request (also in X-Request-ID).
        fields:
          type: object
          additionalProperties:
            type: array
            items:
              type: string
          description: Messages per input field, when the error concerns specific
            fields.
        retry_after:
          type: integer
          description: Seconds to wait before retrying.
      required:
      - code
      - message
      - request_id
      - retry_after
    RegisterRequest:
      type: object
      properties:
        full_name:
          type: string
          minLength: 1
          maxLength: 150
        email:
          type: string
          format: email
          minLength: 1
        password:
          type: string
          minLength: 1
      required:
      - email
      - full_name
      - password
    Session:
      type: object
      description: '`authenticated` is always present; the other fields only when
        it is true.'
      properties:
        authenticated:
          type: boolean
        user:
          $ref: '#/components/schemas/SessionUser'
        context:
          allOf:
          - $ref: '#/components/schemas/WorkspaceContext'
          nullable: true
        contexts:
          type: array
          items:
            $ref: '#/components/schemas/WorkspaceContext'
        context_status:
          $ref: '#/components/schemas/ContextStatusEnum'
        context_ended:
          type: boolean
          description: The previous context stopped being valid (membership or organization
            ended).
        permissions:
          type: array
          items:
            type: string
          description: Permission codes the active context's role grants (empty without
            an organization context).
      required:
      - authenticated
    SessionUser:
      type: object
      properties:
        id:
          type: string
          format: uuid
        email:
          type: string
          format: email
        full_name:
          type: string
      required:
      - email
      - full_name
      - id
    Status:
      type: object
      properties:
        status:
          type: string
          description: ok, accepted, verified or password_changed.
      required:
      - status
    TokenRequest:
      type: object
      properties:
        uid:
          type: string
          minLength: 1
        token:
          type: string
          minLength: 1
      required:
      - token
      - uid
    VersionConflict:
      type: object
      properties:
        error:
          $ref: '#/components/schemas/VersionConflictDetail'
      required:
      - error
    VersionConflictDetail:
      type: object
      properties:
        code:
          type: string
          description: Stable, machine-readable error code.
        message:
          type: string
          description: Message that is safe to show to the user.
        request_id:
          type: string
          description: Correlation ID of the request (also in X-Request-ID).
        fields:
          type: object
          additionalProperties:
            type: array
            items:
              type: string
          description: Messages per input field, when the error concerns specific
            fields.
        current_version:
          type: integer
          description: The version currently stored.
      required:
      - code
      - current_version
      - message
      - request_id
    WorkspaceContext:
      type: object
      properties:
        id:
          type: string
          description: '`individual`, or the organization''s ID.'
        account_type:
          $ref: '#/components/schemas/AccountTypeEnum'
        organization:
          allOf:
          - $ref: '#/components/schemas/ContextOrganization'
          nullable: true
        role:
          type: string
          nullable: true
          description: Role code from the catalogue, e.g. venue_manager.
        role_name:
          type: string
          nullable: true
          description: The role's display name, e.g. Venue manager.
      required:
      - account_type
      - id
      - organization
      - role
      - role_name
  securitySchemes:
    cookieAuth:
      type: apiKey
      in: cookie
      name: sessionid
