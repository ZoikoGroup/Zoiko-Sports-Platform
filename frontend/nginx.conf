# Serves the built SPA and reverse-proxies the Django backend on the same origin.
server {
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;
    server_tokens off;
    client_max_body_size 2m;

    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;

    gzip on;
    gzip_comp_level 5;
    gzip_types text/css application/javascript application/json image/svg+xml;

    # Backend: API, Django admin and its static files.
    location ~ ^/(api|admin|static)/ {
        proxy_pass http://backend:8000;
        # Keep the browser's host:port so Django's CSRF origin check matches.
        proxy_set_header Host $http_host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 30s;
    }

    # Fingerprinted build assets never change.
    location /assets/ {
        expires 1y;
        try_files $uri =404;
    }

    location = /healthz {
        access_log off;
        default_type text/plain;
        return 200 "ok\n";
    }

    # Client-side routes (/login, /register, /workspace, …) fall back to the app.
    location / {
        expires -1;
        try_files $uri $uri/ /index.html;
    }
}
